# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'en-AU'
reviews:
  request_changes_workflow: false
  high_level_summary: true
  poem: true
  review_status: true
  collapse_walkthrough: true
  enable_prompt_for_ai_agents: false
  path_instructions:
    - path: 'frontend-nextjs/**/*'
      instructions: |
        "Confirm that the code adheres to the following:
        - Proper use of Tanstack Query.
        - Efficient requests to the backend.
        - No hardcoded Tailwind styles like bg-[#ffffff], must use src/app/globals.css to change template.
        - All documentation comments for functions reflect the proper function, inputs and outputs"
    - path: 'backend/server/**/*'
      instructions: |
        "Confirm that the code adheres to the following:
        - SpiceDB spicedb/schema.yaml is reflected in src/spicedb/schema.rs.
        - All permissions in the SpiceDB schema are reflection in src/spicedb/policies.rs.
        - Minimal Postgres queries per request. NO N+1 queries at all are allowed.
        - SpiceDB relationships are properly added into required handlers in src/handler/** as per the schema.
        - ZedTokens are never stored directly. The stored token in `AppState::spicedb_zedtoken` is written only by `spicedb::apply_zedtokens()`, the sole writer. Every SpiceDB write originates in this process, so each write path (`DBTransaction::commit`, `spicedb::delete_all_resource_relationships`, the Sequin webhook handler) must publish its returned token over `AppState::spicedb_token_tx`; there is no Watch stream, so a write path that skips publishing leaves the boundary stale until some other write happens. Tokens are applied in publication order and never compared, because ZedTokens are opaque and not reliably ordered; a stale step backwards is harmless since a stale token is still a valid lower bound.
        - All handlers should only call `transaction.commit()` instead of `transaction.tx.commit()` so queued SpiceDB writes flush alongside the Postgres commit.
        - All handlers that mutate the database to create or delete a resource that is also stored in SpiceDB, should create or delete the applicable SpiceDB relationships. When a handler hard-deletes a parent row, confirm the child tables that reference it cascade in Postgres, so Sequin also delivers their delete messages and their SpiceDB relationships are removed; a child that survives its parent keeps a relationship pointing at a deleted resource.
        - All documentation comments for functions reflect the proper function, inputs and outputs
        - All handler functions are documented in backend/api.yaml with the correct input and output schemas
        - When there are multiple IDs in a route, the handler only checks for authorization to mutate the parent resource. Make sure each nested ID is bound to the parent's id, preferably with a filter in the SQL queries used.
        - All delete/edit functions under src/models/**/* should check that the resource exists. The preferred way to do this is by `RETURNING id` at the end of the update/delete SQL call, with `fetch_one()` on `sqlx::query!()`, which will throw a 404 error if no row is returned."
    - path: 'backend/migrations/**/*'
      instructions: |
        "Confirm that the code adheres to the following:
        - No existing file should be changed or deleted. Any changes to tables should be made via new files that migrate the schema.
        - Postgres schema best practices.
        - A new foreign key to a parent that also exists in SpiceDB must use `ON DELETE CASCADE`. Sequin removes a deleted row's SpiceDB relationships explicitly, from that row's own delete message, so a child row that outlives its parent leaves a relationship pointing at a resource that no longer exists. CASCADE makes Postgres delete the child, delivering the child message that removes its relationship. Flag `NO ACTION` and `SET NULL` on such a key, and accept `ON DELETE RESTRICT` only where the child must block deletion of a still-referenced parent.
        - Minimal to no array columns - everything should be normalised.
        - No data duplication between tables."
    - path: 'backend/spicedb/**/*'
      instructions: |
        "Confirm that the code adheres to the following:
        - Valid SpiceDB schema that follows SpiceDB best practices"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - '.*'
    ignore_usernames:
      - 'renovate[bot]'
chat:
  auto_reply: false