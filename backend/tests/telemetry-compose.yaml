# Disposable phase 5 fixtures. Run through telemetry_workflows.py for cleanup.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: telemetry_fixture
      POSTGRES_PASSWORD: telemetry_fixture
      POSTGRES_DB: telemetry_fixture
    command: ["postgres", "-c", "wal_level=logical"]
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry_fixture -d telemetry_fixture"]
      interval: 1s
      timeout: 3s
      retries: 30
  spicedb:
    image: authzed/spicedb:latest
    command: ["serve", "--datastore-engine", "memory", "--grpc-preshared-key", "${CHAOS_PHASE5_KEY}", "--telemetry-endpoint", ""]
    ports: ["127.0.0.1::50051"]
  sequin-db:
    image: postgres:16
    profiles: ["cdc"]
    environment:
      POSTGRES_USER: sequin_fixture
      POSTGRES_PASSWORD: sequin_fixture
      POSTGRES_DB: sequin_fixture
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sequin_fixture -d sequin_fixture"]
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7
    profiles: ["cdc"]
  sequin:
    image: sequin/sequin:v0.14.6
    profiles: ["cdc"]
    environment:
      PG_HOSTNAME: sequin-db
      PG_PORT: 5432
      PG_DATABASE: sequin_fixture
      PG_USERNAME: sequin_fixture
      PG_PASSWORD: sequin_fixture
      REDIS_URL: redis://redis:6379
      SECRET_KEY_BASE: "${CHAOS_PHASE5_SESSION_KEY}"
      VAULT_KEY: "${CHAOS_PHASE5_VAULT_KEY}"
      CONFIG_FILE_PATH: /etc/sequin/sequin.yaml
      SEQUIN_DB_HOST: db
      SEQUIN_DB_PORT: 5432
      SEQUIN_DB_NAME: telemetry_fixture
      SEQUIN_DB_USER: telemetry_fixture
      SEQUIN_DB_PASSWORD: telemetry_fixture
      SEQUIN_WEBHOOK_URL: "${CHAOS_PHASE5_WEBHOOK_URL}"
      SEQUIN_WEBHOOK_SECRET: "${CHAOS_PHASE5_KEY}"
      SEQUIN_API_TOKEN: "${CHAOS_PHASE5_KEY}"
    ports: ["127.0.0.1:${CHAOS_PHASE5_SEQUIN_PORT}:7376"]
    volumes:
      - ../sequin/sequin.yaml:/etc/sequin/sequin.yaml:ro
    depends_on:
      db: {condition: service_healthy}
      sequin-db: {condition: service_healthy}
      redis: {condition: service_started}
