[package]
name = "server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Primary crates
tokio = { version = "1.34", features = ["macros", "rt-multi-thread", "sync", "signal"] }
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9.6", features = ["typed-header", "cookie"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "uuid", "migrate", "macros", "json"] }
# Important secondary crates
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
oauth2 = "4.4"
log = "0.4"
uuid = { version = "1.5", features = ["serde", "v4"] }
nanoid = "0.4.0"
rust-s3 = "0.34.0"
rs-snowflake = "0.6"
jsonwebtoken = "9.1"
dotenvy = "0.15"
handlebars = "6.2"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
time = "0.3.37"
tower-http = { version = "0.6", features = ["cors"] }

# SpiceDB
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

# Ordered map so a coalesced SpiceDB batch keeps change order
indexmap = "2"

# Structured logs, distributed traces, and live host/process metrics.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-appender-tracing = { version = "0.32", default-features = false }
opentelemetry-stdout = { version = "0.32", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "grpc-tonic", "tls-ring", "tls-roots", "internal-logs"] }
sysinfo = "0.38"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Inspect real metric exports in hardware-sampler tests without a collector.
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics", "testing"] }
