# Local SpiceDB source of truth. Restarting the `spicedb` service overwrites
# its stored schema and relationships with the contents of this file.
schema: |-

  definition chaos/user {}
  
  definition chaos/platform {
    relation superuser: chaos/user
    relation user: chaos/user
    permission manage: superuser
    permission use: user + superuser
  }
  
  definition chaos/organisation {
      relation platform: chaos/platform
      relation admin: chaos/user
      relation member: chaos/user
      permission manage = admin + platform->manage
      permission view = member + admin
  }
  
  definition chaos/email_template {
    relation organisation: chaos/organisation
    permission manage = organisation->manage
    permission view = organisation->view
  }

  definition chaos/campaign {
      relation organisation: chaos/organisation
      permission manage = organisation->admin
      permission review = organisation->member + organisation->admin
  }
  
  definition chaos/campaign_role {
    relation campaign: chaos/campaign
    permission manage = campaign->manage
  }

  definition chaos/application {
      relation campaign: chaos/campaign
      relation creator: chaos/user
      permission view = creator + campaign->review
      permission edit = creator
      permission review = campaign->review
  }

  definition chaos/rating {
      relation application: chaos/application
      relation creator: chaos/user
      permission edit = creator
      permission view = application->review
  }

  definition chaos/comment {
      relation application: chaos/application
      relation creator: chaos/user
      permission edit = creator
      permission view = application->review
  }

  definition chaos/question {
    relation campaign: chaos/campaign
    permission manage = campaign->manage
  }
  
  definition chaos/rating_category {
    relation campaign: chaos/campaign
    permission manage = campaign->manage
    permission view = campaign->review
  }

  definition chaos/category_rating {
    relation rating: chaos/rating
    permission edit = rating->edit
    permission view = rating->view
  }
  
  definition chaos/answer {
    relation application: chaos/application
    permission edit = application->edit
    permission view = application->view
  }

  definition chaos/offer {
      relation campaign: chaos/campaign
      relation application: chaos/application
      permission manage = campaign->manage
      permission view = application->creator + campaign->review
      permission reply = application->creator
  }
  