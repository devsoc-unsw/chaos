openapi: "3.0.0"
info:
  title: Chaos API
  version: 1.0.0
servers:
  - url: https://chaos.devsoc.app
    description: Production server
  - url: http://localhost:3000
    description: Local server

paths:
  /auth/google:
    get:
      operationId: googleAuthInit
      description: Redirects the user to Google's OAuth2 authorization URL to begin authentication
      tags:
        - Auth
      parameters:
        - name: to
          in: query
          description: Optional redirect path after successful login (e.g. /dashboard)
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to Google OAuth authorization page
        "500":
          description: Internal server error

  /auth/logout:
    get:
      operationId: logout
      description: Clears the auth_token cookie and redirects to the frontend root
      tags:
        - Auth
      responses:
        "302":
          description: Redirect to frontend root with cleared auth_token cookie

  /api/auth/callback/google:
    get:
      operationId: googleCallback
      description: Google OAuth callback. Exchanges the authorization code for a JWT, sets it as an httpOnly auth_token cookie and redirects to the frontend
      tags:
        - Auth
      parameters:
        - name: code
          in: query
          description: Google OAuth authorization code
          required: true
          schema:
            type: string
        - name: state
          in: query
          description: CSRF state token (used to look up the original redirect path)
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the frontend (saved redirect path or /dashboard) with auth_token cookie set
        "401":
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotLoggedIn"

  /api/v1/dev/super_admin_login:
    get:
      operationId: devSuperAdminLogin
      description: DEV ONLY. Logs in as the seeded super admin user (id 1) and redirects to the dashboard
      tags:
        - Auth
      responses:
        "302":
          description: Redirect to http://localhost:3000/dashboard with auth_token cookie set
        "403":
          description: Endpoint disabled outside of a dev environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

  /api/v1/dev/org_admin_login:
    get:
      operationId: devOrgAdminLogin
      description: DEV ONLY. Logs in as the seeded organisation admin user (id 2) and redirects to the dashboard
      tags:
        - Auth
      responses:
        "302":
          description: Redirect to http://localhost:3000/dashboard with auth_token cookie set
        "403":
          description: Endpoint disabled outside of a dev environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

  /api/v1/dev/user_login:
    get:
      operationId: devUserLogin
      description: DEV ONLY. Logs in as the seeded regular user (id 3) and redirects to the dashboard
      tags:
        - Auth
      responses:
        "302":
          description: Redirect to http://localhost:3000/dashboard with auth_token cookie set
        "403":
          description: Endpoint disabled outside of a dev environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

  /api/v1/user:
    get:
      operationId: getLoggedInUser
      description: Returns info about currently logged in user
      tags:
        - User
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotLoggedIn"

  /api/v1/user/is_superuser:
    get:
      operationId: isSuperuser
      description: Returns whether the currently logged in user is a super user
      tags:
        - User
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_superuser:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/NotLoggedIn"

  /api/v1/user/name:
    patch:
      operationId: updateUserName
      description: Updates currently logged in user's name
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserName"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/NotLoggedIn"

  /api/v1/user/pronouns:
    patch:
      operationId: updateUserPronouns
      description: Updates currently logged in user's pronouns
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPronouns"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/NotLoggedIn"

  /api/v1/user/gender:
    patch:
      operationId: updateUserGender
      description: Updates currently logged in user's gender
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserGender"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/NotLoggedIn"

  /api/v1/user/zid:
    patch:
      operationId: updateUserZid
      description: Updates currently logged in user's zID
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserZid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/NotLoggedIn"

  /api/v1/user/degree:
    patch:
      operationId: updateUserDegree
      description: Updates currently logged in user's degree details
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDegree"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/NotLoggedIn"

  /api/v1/user/applications:
    get:
      operationId: getUserApplications
      description: Returns info about applications made by currently logged in user
      tags:
        - User
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationDetails"
        "401":
          $ref: "#/components/responses/NotLoggedIn"

  /api/v1/user/organisations:
    get:
      operationId: getUserOrganisations
      description: Returns all organisations the current user is a member of (all organisations for super users)
      tags:
        - Organisation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganisationDetails"
        "401":
          $ref: "#/components/responses/NotLoggedIn"

  /api/v1/organisation:
    post:
      operationId: createOrganisation
      description: Create a new organisation
      tags:
        - Organisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrganisation"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/NotSuperUser"

  /api/v1/organisation/slug_check:
    post:
      operationId: checkOrganisationSlugAvailability
      description: Check if a slug is available for a new organisation
      tags:
        - Organisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlugCheck"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Bad request - slug is in use or not ASCII
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequest"
        "401":
          $ref: "#/components/responses/NotSuperUser"

  /api/v1/organisation/{organisation_id}:
    get:
      operationId: getOrganisationById
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      description: Returns info about specified organisation
      tags:
        - Organisation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationDetails"
        "401":
          $ref: "#/components/responses/NotLoggedIn"
    delete:
      operationId: deleteOrganisationById
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      description: Deletes specified organisation
      tags:
        - Organisation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/NotSuperUser"

  /api/v1/organisation/{organisation_id}/role:
    get:
      operationId: getOrganisationUserRole
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      description: Returns the role of the current user within the specified organisation
      tags:
        - Organisation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    $ref: "#/components/schemas/OrganisationRole"
        "401":
          $ref: "#/components/responses/NotLoggedIn"

  /api/v1/organisation/slug/{slug}:
    get:
      operationId: getOrganisationBySlug
      parameters:
        - name: slug
          in: path
          description: Organisation slug
          required: true
          schema:
            type: string
      description: Returns info about specified organisation
      tags:
        - Organisation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationDetails"
        "401":
          $ref: "#/components/responses/NotLoggedIn"

  /api/v1/organisation/{organisation_id}/campaign:
    post:
      operationId: createCampaign
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      description: Create a new campaign inside specified organisation
      tags:
        - Organisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCampaign"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdMessage"
        "401":
          $ref: "#/components/responses/NotOrganisationAdmin"

  /api/v1/organisation/{organisation_id}/campaign/slug_check:
    post:
      operationId: checkCampaignSlugAvailability
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      description: Checks availability of a campaign slug in specified organisation
      tags:
        - Organisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlugCheck"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/NotOrganisationAdmin"

  /api/v1/organisation/{organisation_id}/campaigns:
    get:
      operationId: getAllOrganisationCampaigns
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      description: Returns all campaigns for specified organisation
      tags:
        - Organisation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganisationCampaign"
        "401":
          $ref: "#/components/responses/NotLoggedIn"

  /api/v1/organisation/{organisation_id}/email_template:
    post:
      operationId: createEmailTemplate
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      description: Create a new email template within the organisation
      tags:
        - Organisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewEmailTemplate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/NotOrganisationAdmin"

  /api/v1/organisation/{organisation_id}/email_templates:
    get:
      operationId: getAllOrganisationEmailTemplates
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      description: Get all email templates for specified organisation
      tags:
        - Organisation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailTemplate"
        "401":
          $ref: "#/components/responses/NotOrganisationAdmin"

  /api/v1/organisation/{organisation_id}/logo:
    patch:
      operationId: updateOrganisationLogoById
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      description: Updates the organisation logo and returns a presigned PUT URL to upload the new image to
      tags:
        - Organisation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
                description: Presigned S3 PUT URL to upload the new logo
                example: https://presignedurldemo.s3.eu-west-2.amazonaws.com/6996987893965262849/2d19617b-46fd-4927-9f53-77d69232ba5d
        "401":
          $ref: "#/components/responses/NotOrganisationAdmin"

  /api/v1/organisation/{organisation_id}/members:
    get:
      operationId: getOrganisationMembers
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      description: Returns list of members of specified organisation
      tags:
        - Organisation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/NotOrganisationAdmin"
    put:
      operationId: updateOrganisationMembers
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateList"
      description: Replaces the list of members (role "User") for an organisation
      tags:
        - Organisation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/NotOrganisationAdmin"

  /api/v1/organisation/{organisation_id}/user:
    post:
      operationId: inviteUser
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      description: Invites a user to the organisation by email. If the user already exists they are added directly
      tags:
        - Organisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberToInvite"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Invite code (or empty string if the user was added directly)
                    example: 3fKd9sLp2qW
        "401":
          $ref: "#/components/responses/NotOrganisationAdmin"
    delete:
      operationId: removeUser
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      description: Removes a user (role "User") from the organisation
      tags:
        - Organisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberToRemove"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/NotOrganisationAdmin"

  /api/v1/organisation/{organisation_id}/member:
    put:
      operationId: updateOrganisationMember
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleUpdate"
      description: Updates a single member's role (promote to Admin or demote to User). Super users only
      tags:
        - Organisation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/NotSuperUser"

  /api/v1/organisation/{organisation_id}/admins:
    get:
      operationId: getOrganisationAdmins
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      description: Returns list of admins of specified organisation
      tags:
        - Organisation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/NotSuperUser"
    put:
      operationId: updateOrganisationAdmins
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateList"
      description: Replaces the list of administrators for an organisation
      tags:
        - Organisation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/NotSuperUser"

  /api/v1/organisation/{organisation_id}/admin:
    delete:
      operationId: deleteOrganisationAdmin
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberToRemove"
      description: Removes an administrator from the organisation (demotes them to role "User")
      tags:
        - Organisation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/NotSuperUser"

  /api/v1/organisation/{organisation_id}/users:
    get:
      operationId: getOrganisationUsers
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      description: Returns all members with role "User" for the organisation
      tags:
        - Organisation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/NotOrganisationAdmin"
    put:
      operationId: getOrganisationUsersPut
      parameters:
        - name: organisation_id
          in: path
          description: Organisation ID
          required: true
          schema:
            type: integer
            format: int64
      description: Same handler as GET - returns all members with role "User" for the organisation (no request body)
      tags:
        - Organisation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/NotOrganisationAdmin"

  /api/v1/campaign/{campaign_id}/rating_category:
    post:
      operationId: createRatingCategory
      parameters:
        - name: campaign_id
          in: path
          description: Campaign ID
          required: true
          schema:
            type: integer
            format: int64
      description: Creates a new rating category for a campaign
      tags:
        - Rating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCategoryRating"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
                description: ID of the created rating category
                example: 6996987893965262849
        "401":
          $ref: "#/components/responses/NotOrganisationAdmin"

  /api/v1/campaign/{campaign_id}/rating_categories:
    get:
      operationId: getRatingCategoriesByCampaign
      parameters:
        - name: campaign_id
          in: path
          description: Campaign ID
          required: true
          schema:
            type: integer
            format: int64
      description: Returns all rating categories for a campaign
      tags:
        - Rating
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryRating"
        "401":
          $ref: "#/components/responses/NotOrganisationAdmin"

  /api/v1/campaign/{campaign_id}/rating_category/{category_id}:
    patch:
      operationId: updateRatingCategory
      parameters:
        - name: campaign_id
          in: path
          description: Campaign ID
          required: true
          schema:
            type: integer
            format: int64
        - name: category_id
          in: path
          description: Rating category ID
          required: true
          schema:
            type: integer
            format: int64
      description: Updates a rating category's name
      tags:
        - Rating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCategoryRating"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/NotOrganisationAdmin"
    delete:
      operationId: deleteRatingCategory
      parameters:
        - name: campaign_id
          in: path
          description: Campaign ID
          required: true
          schema:
            type: integer
            format: int64
        - name: category_id
          in: path
          description: Rating category ID
          required: true
          schema:
            type: integer
            format: int64
      description: Deletes a rating category from a campaign
      tags:
        - Rating
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/NotOrganisationAdmin"

  /api/v1/application/{application_id}/rating:
    post:
      operationId: createRating
      parameters:
        - name: application_id
          in: path
          description: Application ID
          required: true
          schema:
            type: integer
            format: int64
      description: Creates a new rating with comment and category scores for the specified application
      tags:
        - Rating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRating"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
