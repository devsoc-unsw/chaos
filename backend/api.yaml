components:
  schemas:
    Message:
      type: object
      properties:
        message:
          type: string
          example: Success

    NotLoggedIn:
      type: object
      properties:
        message:
          type: string
          example: Not logged in

    Unauthorized:
      type: object
      properties:
        message:
          type: string
          example: Unauthorized

    BadRequest:
      type: object
      properties:
        message:
          type: string
          example: Bad request

    IdMessage:
      type: object
      description: Response containing a single ID (serialized as string to preserve large integer precision)
      properties:
        id:
          type: string
          example: "6996987893965262849"

    UserRole:
      type: string
      enum:
        - User
        - SuperUser
      example: User

    User:
      type: object
      properties:
        id:
          type: string
          description: User ID (as string to preserve large integer precision)
          example: "1541815603606036480"
        email:
          type: string
          example: clancy.lion@unsw.edu.au
        zid:
          type: string
          nullable: true
          example: z1234567
        name:
          type: string
          example: Clancy Lion
        pronouns:
          type: string
          nullable: true
          example: he/him
        gender:
          type: string
          nullable: true
          example: male
        degree_name:
          type: string
          nullable: true
          example: Computer Science
        degree_starting_year:
          type: integer
          format: int32
          nullable: true
          example: 2024
        role:
          $ref: "#/components/schemas/UserRole"

    UserDetails:
      type: object
      description: User details nested inside application responses
      properties:
        id:
          type: string
          description: User ID (as string to preserve large integer precision)
          example: "1541815603606036480"
        email:
          type: string
          example: clancy.lion@unsw.edu.au
        zid:
          type: string
          nullable: true
          example: z1234567
        name:
          type: string
          example: Clancy Lion
        pronouns:
          type: string
          nullable: true
          example: he/him
        gender:
          type: string
          nullable: true
          example: male
        degree_name:
          type: string
          nullable: true
          example: Computer Science
        degree_starting_year:
          type: integer
          format: int32
          nullable: true
          example: 2024

    UserName:
      type: object
      properties:
        name:
          type: string
          example: "Clancy Tiger"

    UserPronouns:
      type: object
      properties:
        pronouns:
          type: string
          example: They/Them

    UserGender:
      type: object
      properties:
        gender:
          type: string
          example: Female

    UserZid:
      type: object
      properties:
        zid:
          type: string
          example: z5123456

    UserDegree:
      type: object
      properties:
        degree_name:
          type: string
          example: Electrical Engineering
        degree_starting_year:
          type: integer
          format: int32
          example: 2024

    OrganisationRole:
      type: string
      nullable: true
      enum:
        - User
        - Admin
      example: Admin

    OrganisationDetails:
      type: object
      properties:
        id:
          type: string
          description: Organisation ID (as string to preserve large integer precision)
          example: "6996987893965262849"
        slug:
          type: string
          example: devsoc-unsw
        name:
          type: string
          example: UNSW Software Development Society
        logo:
          type: string
          format: uuid
          nullable: true
          example: "76718252-2a13-4de2-bc07-f977c75dc52b"
        created_at:
          type: string
          format: date-time
          example: 2024-02-10T18:25:43.511Z
        contact_email:
          type: string
          example: contact@devsoc.app
        website_url:
          type: string
          nullable: true
          example: https://devsoc.app

    NewOrganisation:
      type: object
      properties:
        slug:
          type: string
          example: unsw-devsoc
        name:
          type: string
          example: UNSW Software Development Society
        admin:
          type: string
          description: ID of the user who will be the initial administrator (as string to preserve large integer precision)
          example: "1541815603606036480"
        contact_email:
          type: string
          example: contact@devsoc.app
        website_url:
          type: string
          nullable: true
          example: https://devsoc.app

    SlugCheck:
      type: object
      properties:
        slug:
          type: string
          example: unsw-devsoc

    Member:
      type: object
      properties:
        id:
          type: string
          description: User ID (as string to preserve large integer precision)
          example: "1541815603606036480"
        name:
          type: string
          example: Clancy Lion
        email:
          type: string
          example: clancy.lion@unsw.edu.au
        role:
          $ref: "#/components/schemas/OrganisationRole"

    AdminUpdateList:
      type: object
      properties:
        members:
          type: array
          description: User IDs (as strings to preserve large integer precision)
          items:
            type: string
          example: ["1541815603606036480", "1541815603606036827"]

    MemberToRemove:
      type: object
      properties:
        user_id:
          type: string
          description: User ID (as string to preserve large integer precision)
          example: "1541815603606036480"

    MemberRoleUpdate:
      type: object
      properties:
        user_id:
          type: string
          description: User ID (as string to preserve large integer precision)
          example: "1541815603606036480"
        role:
          $ref: "#/components/schemas/OrganisationRole"

    MemberToInvite:
      type: object
      properties:
        email:
          type: string
          example: new.member@unsw.edu.au

    OrganisationCampaign:
      type: object
