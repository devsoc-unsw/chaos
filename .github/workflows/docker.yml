name: Docker

on:
  push:
    branches:
      - main
      - staging

env:
  REGISTRY: ghcr.io
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'staging' || 'staging' }}
  IMAGE_NAME: ${{ github.ref_name == 'main' && 'chaos' || 'chaos-staging' }}

jobs:
  # ---------------------------------------------------------------------
  # Backend: generate sqlx offline query metadata once (platform-independent),
  # share it with both arch builds so we don't need Postgres in every job.
  # ---------------------------------------------------------------------
  sqlx-prepare:
    name: Prepare SQLx offline metadata
    runs-on: ubuntu-latest
    permissions:
        contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: chaos
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ github.token }}
      
      - name: Setup Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/server/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      
      - name: Setup temporary DB
        working-directory: backend
        run: |
          which sqlx || cargo install sqlx-cli --no-default-features --features native-tls,postgres
          echo "DATABASE_URL=postgres://postgres:password@localhost:5432/chaos" >> .env
          sqlx migrate run
      
      - name: Generate SQLx files
        working-directory: backend/server
        run: cargo sqlx prepare
      
      - name: Upload SQLx metadata
        uses: actions/upload-artifact@v4
        with:
          name: sqlx-metadata
          include-hidden-files: true
          path: backend/server/.sqlx
          retention-days: 1

  # ---------------------------------------------------------------------
  # Backend: build natively on amd64 and arm64 runners, push by digest.
  # ---------------------------------------------------------------------
  build-backend:
    name: Build (Backend / ${{ matrix.platform }})
    needs: [sqlx-prepare]
    runs-on: ${{ matrix.runner }}
    environment:
      name: staging
      url: https://chaos.devsoc.app
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ github.token }}
      
      - name: Download SQLx metadata
        uses: actions/download-artifact@v4
        with:
          name: sqlx-metadata
          path: backend/server/.sqlx

      - name: Setup cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/server/target/
          key: ${{ runner.os }}-${{ matrix.suffix }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.suffix }}-cargo-
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}  
          cache-from: type=gha,scope=backend-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.suffix }}
          outputs: type=image,name=ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-backend,push-by-digest=true,name-canonical=true,push=true
      
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-backend-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  
  merge-backend:
    name: Merge (Backend manifest)
    runs-on: ubuntu-latest
    needs: [build-backend]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-backend-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
      
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-backend@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}

  # ---------------------------------------------------------------------
  # Frontend: same native-per-arch, push-by-digest, merge pattern.
  # ---------------------------------------------------------------------
  build-frontend:
    name: Build (Frontend / ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    environment:
      name: staging
      url: https://chaos.devsoc.app
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: frontend-nextjs
          file: frontend-nextjs/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha,scope=frontend-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.suffix }}
          outputs: type=image,name=ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-frontend,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-frontend-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-frontend:
    name: Merge (Frontend manifest)
    runs-on: ubuntu-latest
    needs: [build-frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-frontend-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-frontend@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}

  # ---------------------------------------------------------------------
  # Deploy
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy (CD)
    runs-on: ubuntu-latest
    needs: [merge-frontend, merge-backend]
    concurrency: staging
    environment:
      name: staging
      url: https://chaosstaging.devsoc.app
    steps:
      - name: Dispatch deployment
        uses: devsoc-unsw/deployment-dispatch-action@main
        with:
          deployment-dispatcher-app-id: ${{ vars.DEPLOYMENT_DISPATCHER_APP_ID }}
          deployment-dispatcher-app-private-key: ${{ secrets.DEPLOYMENT_DISPATCHER_APP_PRIVATE_KEY }}
          updates: |
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-frontend=${{ github.sha }}
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-backend=${{ github.sha }}
